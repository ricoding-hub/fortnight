<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Sin maximum-scale: bloquear el zoom incumple WCAG 2.1 SC 1.4.4 y en una
         app de cifras es especialmente grave para usuarios con baja visión. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F7F4ED" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fortnight" />
    <!-- iOS no admite alfa en el icono de inicio: según la versión lo compone
         sobre negro o descarta el icono y genera un mosaico con la inicial.
         Estos van compuestos sobre el crema de la app, sin transparencia, y
         con `sizes` para que iOS no tenga que reescalar. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.v2.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-touch-icon-167.v2.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152.v2.png" />

         instalada arranca en blanco. -->
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/splash-1290x2796.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/splash-1179x2556.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/splash-1284x2778.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/splash-1170x2532.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/splash-1125x2436.png" />

    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/splash-828x1792.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/splash-750x1334.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/splash-1536x2048.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/splash-1668x2388.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/splash-2048x2732.png" />
    <meta
      name="description"
      content="Fortnight — Tu app de finanzas personales. Controla tus gastos, deudas y préstamos cada catorcena."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Declaradas aquí y no con @import en el CSS: dentro del CSS el navegador
         no las descubre hasta haber descargado y analizado la hoja, encadenando
         un viaje extra antes de poder pintar texto. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Geist+Mono:wght@400;500;600&display=swap"
    />
    <title>Fortnight — Finanzas personales</title>
    <!--
      Red de arranque. Tiene que ir aquí, en línea y antes del bundle: si el
      service worker sirve un armazón viejo que apunta a un archivo que ya no
      existe — y eso pasa en cada despliegue, porque el nombre lleva el hash del
      contenido — el bundle da 404, React no arranca y queda una página en
      blanco. Cualquier código que viviera dentro del bundle no llegaría a
      ejecutarse. El ErrorBoundary tampoco: sólo atrapa lo que React dibuja.

      Lo que hace: si falla un script o una hoja de estilo DEL MISMO ORIGEN,
      desregistra los workers, borra las cachés y recarga UNA vez. La marca en
      sessionStorage impide el bucle, y main.tsx la borra cuando el arranque
      llega a buen puerto.

      El mismo origen es la condición que importa: la tipografía viene de
      fonts.googleapis.com y falla por una red corporativa, un bloqueador o
      estar sin conexión. Borrar la caché por eso sería tirarla justo cuando el
      usuario no tiene red y más la necesita.
    -->
    <script>
      (function () {
        var MARCA = 'fortnight:recuperado'
        var curando = false

        function propio(el) {
          if (!el || typeof el.tagName !== 'string') return false
          var tag = el.tagName.toUpperCase()
          if (tag !== 'SCRIPT' && !(tag === 'LINK' && el.rel === 'stylesheet')) return false
          var url = el.src || el.href || ''
          if (!url) return false
          try {
            return new URL(url, location.origin).origin === location.origin
          } catch (e) {
            return false
          }
        }

        function curar(motivo) {
          if (curando) return
          try {
            if (sessionStorage.getItem(MARCA)) {
              console.error('[Fortnight] el bundle sigue sin cargar tras limpiar:', motivo)
              return
            }
            sessionStorage.setItem(MARCA, '1')
          } catch (e) {
            return // Sin sessionStorage no hay forma de evitar el bucle.
          }
          curando = true
          console.warn('[Fortnight] bundle roto, limpiando y recargando:', motivo)
          var tareas = []
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              tareas.push(
                navigator.serviceWorker.getRegistrations().then(function (rs) {
                  return Promise.all(rs.map(function (r) { return r.unregister() }))
                }),
              )
            }
            if (window.caches && caches.keys) {
              tareas.push(
                caches.keys().then(function (ks) {
                  return Promise.all(ks.map(function (k) { return caches.delete(k) }))
                }),
              )
            }
          } catch (e) { /* el navegador no lo permite; recargar aún puede servir */ }
          Promise.all(tareas)
            .catch(function () {})
            .then(function () { location.reload() })
        }

        addEventListener(
          'error',
          function (e) { if (propio(e.target)) curar('recurso propio ' + e.target.tagName) },
          true, // los errores de carga de recursos no burbujean: hay que capturarlos
        )
        addEventListener('unhandledrejection', function (e) {
          var m = (e.reason && e.reason.message) || String(e.reason || '')
          if (/Failed to fetch dynamically imported module|error loading dynamically imported module|Importing a module script failed|Unable to preload|ChunkLoadError/i.test(m)) {
            curar('import dinámico')
          }
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
